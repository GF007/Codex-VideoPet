[package]
name = "codex-pet-overlay"
version = "0.1.0"
description = "Low-overhead Codex desktop video overlay"
authors = ["Local"]
edition = "2021"

[lib]
name = "codex_pet_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
codex-pet-native = { path = "../native", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
tiny_http = "0.12"

[features]
default = []
editor = ["dep:codex-pet-native"]
